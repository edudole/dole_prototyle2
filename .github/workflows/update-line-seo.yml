name: Update LINE SEO from Google Sheet

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: lp360-seo-prerender
  cancel-in-progress: true

jobs:
  update-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read T3/T4 and write static SEO
        run: node tools/update-seo.mjs

      - name: Commit updated SEO
        shell: bash
        run: |
          if git diff --quiet; then
            echo "SEO ไม่มีการเปลี่ยนแปลง"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*/index.html'
          git commit -m "chore: update LINE/OG SEO from Google Sheet"
          git push
